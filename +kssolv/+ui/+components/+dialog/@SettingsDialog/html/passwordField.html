<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: transparent;
            font-family: Arial, Helvetica, sans-serif;
        }

        #password {
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            min-height: 22px;
            padding: 2px 7px;
            border: 1px solid rgb(153, 153, 153);
            border-radius: 2px;
            background: white;
            color: rgb(38, 38, 38);
            font-size: 13px;
            outline: none;
        }

        #password:focus {
            border-color: rgb(0, 114, 189);
            box-shadow: 0 0 0 1px rgb(0, 114, 189);
        }
    </style>
</head>
<body>
    <input id="password" type="password" autocomplete="off"
           aria-label="OpenAI-compatible API key" spellcheck="false">
    <script>
        function setup(htmlComponent) {
            const input = document.getElementById("password");

            const synchronizeFromMATLAB = () => {
                const data = htmlComponent.Data;
                const value = data && typeof data.Value === "string" ? data.Value : "";
                if (document.activeElement !== input && input.value !== value) {
                    input.value = value;
                }
            };

            htmlComponent.addEventListener("DataChanged", synchronizeFromMATLAB);
            input.addEventListener("input", () => {
                htmlComponent.sendEventToMATLAB("ValueChanged", input.value);
            });
            synchronizeFromMATLAB();
        }
    </script>
</body>
</html>
