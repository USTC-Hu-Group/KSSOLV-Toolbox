<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        html, body {
            box-sizing: border-box;
            height: 100%;
            margin: 0;
            overflow: hidden;
            width: 100%;
        }

        input {
            border: 1px solid rgb(118, 118, 118);
            border-radius: 2px;
            box-sizing: border-box;
            font: 14px Arial, sans-serif;
            height: 100%;
            padding: 1px 6px;
            width: 100%;
        }

        input:focus {
            border-color: rgb(0, 114, 189);
            outline: 1px solid rgb(0, 114, 189);
        }

        input:disabled {
            background: rgb(240, 240, 240);
            border-color: rgb(204, 204, 204);
            color: rgb(160, 160, 160);
        }
    </style>
    <script>
        function setup(htmlComponent) {
            const input = document.getElementById("passwordField");

            function applyData() {
                const data = htmlComponent.Data || {};
                const value = data.Value || "";
                if (input.value !== value) {
                    input.value = value;
                }
                input.disabled = data.Enabled === false;
                input.placeholder = data.Placeholder || "";
            }

            input.addEventListener("input", function () {
                const data = htmlComponent.Data || {};
                htmlComponent.Data = {
                    Value: input.value,
                    Enabled: data.Enabled !== false,
                    Placeholder: data.Placeholder || ""
                };
            });
            htmlComponent.addEventListener("DataChanged", applyData);
            applyData();
        }
    </script>
</head>
<body>
    <input id="passwordField" type="password" autocomplete="off">
</body>
</html>
