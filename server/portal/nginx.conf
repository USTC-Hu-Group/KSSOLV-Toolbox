pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes 1;
events { worker_connections 2048; }
http {
    access_log off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 256m;
    client_body_timeout 30s;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    # Multiple CSP headers intersect. Replace Connector's ancestor directive
    # while retaining its script, resource and connection restrictions.
    map $upstream_http_content_security_policy $workspace_csp {
        "" "frame-ancestors __ORIGIN__ 'self'";
        default "$upstream_http_content_security_policy; frame-ancestors __ORIGIN__ 'self'";
        "~*^(?<csp_before>.*?)frame-ancestors[^;]*(?<csp_after>.*)$" "$csp_before$csp_after; frame-ancestors __ORIGIN__ 'self'";
    }
    resolver __RESOLVER__ valid=5s ipv6=off;
__TRUSTED_PROXIES__
    server {
        listen 8080;
        server_name _;
        absolute_redirect off;
        # Optional public manuals are bundled in the image, never read from a host mount.
        # Native nginx static responses support HEAD, byte ranges and revalidation.
        location = /online/docs/zh-CN.pdf {
            alias /opt/kssolv/portal/manuals/zh-CN.pdf;
            error_page 404 = @manual_zh_latest;
            default_type application/pdf;
            add_header Content-Disposition 'inline; filename="KSSOLV_Toolbox_User_Manual_zh-CN.pdf"';
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location = /online/docs/en-US.pdf {
            alias /opt/kssolv/portal/manuals/en-US.pdf;
            error_page 404 = @manual_en_latest;
            default_type application/pdf;
            add_header Content-Disposition 'inline; filename="KSSOLV_Toolbox_User_Manual_en.pdf"';
            add_header Cache-Control "no-cache";
            add_header X-Content-Type-Options nosniff always;
        }
        location @manual_zh_latest {
            add_header Cache-Control "no-store";
            return 302 https://github.com/USTC-Hu-Group/KSSOLV-Toolbox-Manual/releases/latest/download/KSSOLV_Toolbox_User_Manual_zh-CN.pdf;
        }
        location @manual_en_latest {
            add_header Cache-Control "no-store";
            return 302 https://github.com/USTC-Hu-Group/KSSOLV-Toolbox-Manual/releases/latest/download/KSSOLV_Toolbox_User_Manual_en.pdf;
        }
        location = /online {
            if ($host = __HUB_HOST__) { rewrite ^ /_portal/ last; }
            rewrite ^ /__tenant_online last;
        }
        location = /healthz { proxy_pass http://127.0.0.1:8091/healthz; }
        location ^~ /_portal/ {
            proxy_pass http://127.0.0.1:8091;
            proxy_set_header X-Original-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_set_header X-KSSOLV-Client-IP $remote_addr;
            proxy_set_header X-KSSOLV-Proxy-Token "__PROXY_TOKEN__";
            proxy_read_timeout 30s;
            proxy_buffering off;
        }
        location = /_auth {
            internal;
            proxy_pass http://127.0.0.1:8091/internal/auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-Host $http_host;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Original-Origin $http_origin;
        }
        location / {
            if ($host = __HUB_HOST__) { return 302 /online; }
            auth_request /_auth;
            auth_request_set $runtime $upstream_http_x_kssolv_upstream;
            auth_request_set $runtime_authorization $upstream_http_x_kssolv_authorization;
            auth_request_set $runtime_cookie $upstream_http_x_kssolv_cookie;
            error_page 401 = @login;
            rewrite ^/__tenant_online$ /online break;
            proxy_pass http://$runtime;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Cookie $runtime_cookie;
            proxy_set_header Authorization $runtime_authorization;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Accept-Encoding "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 120s;
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/_portal/favicon.js"></script><script src="/_portal/bridge.js"></script><script src="/_portal/activity.js" defer></script>';
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Content-Security-Policy;
            add_header Content-Security-Policy $workspace_csp always;
            add_header Referrer-Policy no-referrer always;
        }
        location @login {
            rewrite ^ /_portal/connection-error break;
            proxy_pass http://127.0.0.1:8091;
            proxy_set_header X-Original-Host $http_host;
            proxy_set_header Host $http_host;
            proxy_buffering off;
        }
    }
}
